networks:
  searxng-test:

services:
  searxng-a:
    image: searxng/searxng:latest
    container_name: searxng-test-a
    ports:
      - "8081:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8081/
    networks:
      - searxng-test

  searxng-b:
    image: searxng/searxng:latest
    container_name: searxng-test-b
    ports:
      - "8082:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8082/
    networks:
      - searxng-test
