use_default_settings: true

general:
  instance_name: "searxng-cf-test"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  # Real value is injected at runtime from the SEARXNG_SECRET env var
  # (a Cloudflare Worker secret passed into the container — see src/search.ts).
  # This placeholder is only used for local runs without that secret set.
  secret_key: "ultrasecretkey"
  limiter: false
  image_proxy: true

ui:
  static_use_hash: true
